# M1-C frozen one-shot baseline matrix. Do not tune after inspecting results.
mode: one_shot
launch:
  package: air_ground_bringup
  file: air_ground_inspection_experiment.launch
seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
        1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
        1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029]
registration_dx_m: 0.60
registration_dy_m: 0.0
# Frozen baseline ran at the historical 1.5 m acquisition altitude; the
# runner forwards this explicitly so launch-default changes stay isolated.
registration_altitude_m: 1.5
timeout_seconds: 180.0
epoch_seconds: 0.0
output_root: /tmp/air_ground_experiments/matrix_one_shot
bounds:
  uav_x: [-4.0, -2.0]
  uav_y: [-2.0, 2.0]
  uav_yaw_deg: [-180.0, 180.0]
  ugv_heading_offset_deg: [-180.0, 180.0]
  uav_frame_xy_m: [-3.0, 3.0]
  uav_frame_yaw_deg: [-45.0, 45.0]
  ugv_frame_xy_m: [-3.0, 3.0]
  ugv_frame_yaw_deg: [-45.0, 45.0]
drift: zero
